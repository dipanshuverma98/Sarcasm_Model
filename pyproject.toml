[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sarcasm-detection"
version = "1.0.0"
description = "BERT-based sarcasm detection on COVID-19 Twitter data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Dipanshu Verma" }]
keywords = ["sarcasm", "NLP", "BERT", "text-classification", "deep-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.38.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
demo = ["gradio>=4.20.0"]
dev  = ["pytest>=8.0.0", "matplotlib>=3.8.0", "seaborn>=0.13.0"]

[project.scripts]
sarcasm-train    = "sarcasm.train:main"
sarcasm-evaluate = "sarcasm.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
